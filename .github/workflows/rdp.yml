name: RDP Ngrok
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
    - name: Install Ngrok via Choco
      run: |
        choco install ngrok -y

    - name: Enable RDP Access
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: Create RDP Account
      run: |
        $password = ConvertTo-SecureString "Khoi@14042000!" -AsPlainText -Force
        New-LocalUser -Name "RDP" -Password $password -AccountNeverExpires -PasswordNeverExpires
        Add-LocalGroupMember -Group "Administrators" -Member "RDP"
        Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

    - name: Start Ngrok Tunnel
      run: |
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}
        Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log"

    - name: Output RDP Info & Keep Alive
      run: |
        $url = $null
        $count = 0
        while ($null -eq $url -and $count -lt 10) {
            Start-Sleep -Seconds 3
            $count++
            try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:4040/api/tunnels" -ErrorAction Stop
                $url = $response.tunnels[0].public_url
            } catch {
                Write-Host "Dang kiem tra Ngrok API (Lan $count/10)..."
            }
        }
        
        if ($null -ne $url) {
            $publicUrl = $url -replace 'tcp://', ''
            Write-Host "`n========================================================"
            Write-Host " DIA CHI KET NOI RDP: $publicUrl"
            Write-Host " USERNAME           : RDP"
            Write-Host " PASSWORD           : Khoi@14042000!"
            Write-Host "========================================================`n"
            while ($true) { Start-Sleep -Seconds 300 }
        } else {
            Write-Host "`n[!] KET NOI NGROK THAT BAI. CHI TIET LOI BENE DUOI:"
            if (Test-Path "ngrok.log") { Get-Content "ngrok.log" }
            if (Test-Path "ngrok_err.log") { Get-Content "ngrok_err.log" }
            exit 1
        }
